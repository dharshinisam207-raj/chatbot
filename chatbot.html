<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot</title>

<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #0f0f0f, #1a1a1a, #000000);
        font-family: 'Poppins', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
    }

    .chat-container {
        width: 800px;
        height: 600px;
        background: rgba(30, 30, 30, 0.95);
        border-radius: 20px;
        backdrop-filter: blur(8px);
        display: flex;
        flex-direction: row;
        overflow: hidden;
        box-shadow: 0 0 25px #00A8FF;
        border: 1px solid rgba(255,255,255,0.1);
    }

    /* LEFT PANEL */
    .left-panel {
        width: 40%;
        background: #111;
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        border-right: 1px solid #333;
    }

    .left-panel img {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 15px;
        box-shadow: 0 0 12px rgba(0,150,255,0.8);
    }

    .left-panel button {
        margin-top: 20px;
        padding: 10px 15px;
        border: none;
        border-radius: 10px;
        background: #0078FF;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .left-panel button:hover {
        transform: scale(1.08);
        background: #0088dd;
    }

    /* RIGHT PANEL */
    .right-panel {
        width: 60%;
        display: flex;
        flex-direction: column;
    }

    .header {
        padding: 18px;
        color: #00A8FF;
        background: rgba(0, 0, 0, 0.4);
        font-size: 24px;
        text-align: center;
        font-weight: bold;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .header img {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        object-fit: cover;
    }

    .chat-box {
        flex: 1;
        padding: 12px;
        overflow-y: auto;
        color: white;
    }

    .msg {
        margin: 12px 0;
        padding: 12px 14px;
        max-width: 75%;
        border-radius: 12px;
        line-height: 1.4;
        animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .user {
        background: #0078FF;
        margin-left: auto;
        box-shadow: 0 0 10px rgba(0,120,255,0.5);
    }

    .bot {
        background: #3b3b3b;
        margin-right: auto;
    }

    /* Typing animation */
    .typing {
        font-size: 12px;
        opacity: 0.6;
        margin-bottom: 5px;
    }

    /* Suggestions */
    #suggestions button {
        background: #222;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #00A8FF;
        color: white;
        cursor: pointer;
        transition: 0.2s;
    }

    #suggestions button:hover {
        background: #00A8FF;
    }

    .input-area {
        display: flex;
        padding: 12px;
        background: rgba(0, 0, 0, 0.4);
        border-top: 1px solid rgba(255,255,255,0.1);
        gap: 10px;
    }

    .input-area input {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        outline: none;
        background: #222;
        color: white;
        font-size: 14px;
    }

    .input-area button {
        padding: 10px 18px;
        border: none;
        background: #00A8FF;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    .input-area button:hover {
        transform: scale(1.05);
    }
</style>

</head>
<body>

<div class="chat-container">

    
    <div class="left-panel">
        <img src="robo.jpg" alt="AI Bot">
        <h2>Robo Assistant</h2>
        <p style="color:#00A8FF;font-size:14px;margin:0;">Level 1 • Friendly AI</p>
        <button onclick="clearChat()">Clear Chat</button>
    </div>

    
    <div class="right-panel">

        <div class="header">
            <img src="robo.jpg">
            <span>AI Chatbot</span>
        </div>

        

        <div class="chat-box" id="chatBox"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
            <button onclick="startVoice()">🎤</button>
        </div>

    </div>
</div>

<script>
const chatBox = document.getElementById("chatBox");




function addTypingEffect(text) {
    let msg = document.createElement("div");
    msg.classList.add("msg", "bot");
    chatBox.appendChild(msg);

    let i = 0;
    let interval = setInterval(() => {
        msg.textContent += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(interval);
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 40);
}

function showTyping() {
    let t = document.createElement("div");
    t.id = "typing";
    t.classList.add("typing");
    t.textContent = "Typing...";
    chatBox.appendChild(t);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function hideTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
}


function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.classList.add("msg", sender);
    msg.textContent = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

/* BOT LOGIC */
function botReply(text) {
    text = text.toLowerCase();

    const qa = [
        { q: ["hi"], a: "Hi! What about your day?" },
        { q: ["who are you"], a: "I'm an AI chatbot created to talk with you 😊" },
        { q: ["good", "fine", "nice"], a: "Nice! Glad to hear that 😄" },
        { q: ["love"], a: "Love is a beautiful feeling ❤️" },
        { q: ["i am bored"], a: "Want a joke? 😄" },
        { q: ["joke"], a: "Why don't robots get tired? Because they recharge! 🤖⚡" },
        { q: ["food"], a: "Yummy! What's your favourite dish? 😋" },
        { q: ["game"], a: "I can play a guessing game with you! 🎮" },
        { q: ["age"], a: "I'm timeless 😎" },
        { q: ["beautiful"], a: "Aww thank you! You're sweeter than code 🍫" },
        { q: ["movie"], a: "Movies are fun! What's your favourite genre? 🍿" },
        { q: ["song"], a: "Music is life 🎶 Tell me your fav song!" },
        { q: ["web technology"], a: "Web Technology helps create websites, web apps, and online systems." },
        { q: [" what is tags"], a: "Tags define structure, layout, and meaning of webpage content." },
        { q: [" do you know about html"], a: "HTML is the structure of a webpage. It uses tags to organize content." },
        { q: ["css is used for "], a: "CSS styles websites — colors, layout, fonts, animations." },
        { q: [" what is javascript", "js"], a: "JavaScript makes websites interactive and dynamic." },
        { q: ["frontend"], a: "Frontend is what users see — UI, HTML, CSS, JS." },
        { q: ["backend"], a: "Backend handles databases, APIs, servers, authentication." },
        { q: [" api meaning"], a: "API allows two systems to communicate, like chatbot to server." },
        { q: ["framework"], a: "Frameworks like React, Angular, Django help build apps faster." },
        { q: ["browser"], a: "A browser displays web pages — Chrome, Edge, Firefox." },
        { q: ["hosting"], a: "Hosting puts your website online for people to access." },
        { q: ["database"], a: "Databases store data — MySQL, MongoDB, PostgreSQL." },
        { q: ["ai", "artificial intelligence"], a: "AI makes machines think and respond like humans!" },
        { q: ["machine learning", "ml"], a: "ML trains models using data to make predictions." },
        { q: ["deep learning"], a: "Deep Learning uses multiple neural layers for complex tasks." },
        { q: ["neural network"], a: "Neural networks work like brain neurons to process information." },
        { q: ["dataset"], a: "A dataset is training data used in ML and AI." },
        { q: ["what is chatbot"], a: "A chatbot uses AI or fixed rules to chat with users." },
      ];

    for (let pair of qa) {
        if (pair.q.some(keyword => text.includes(keyword))) {
            return pair.a;
        }
    }

    return "Interesting! Tell me more 😄";
}

/* SEND MESSAGE */
function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();

    if (text === "") return;

    addMessage(text, "user");
    input.value = "";

    showTyping();

    setTimeout(() => {
        hideTyping();
        const reply = botReply(text);
        addTypingEffect(reply);
    }, 800);
}

/* CLEAR CHAT */
function clearChat() {
    chatBox.innerHTML = "";
}

/* VOICE INPUT */
function startVoice() {
    let recognition = new webkitSpeechRecognition();
    recognition.lang = "en-US";

    recognition.onresult = function(event) {
        let voiceText = event.results[0][0].transcript;
        addMessage(voiceText, "user");
        const reply = botReply(voiceText);
        setTimeout(() => addTypingEffect(reply), 500);
    };

    recognition.start();
}
</script>

</body>
</html>
